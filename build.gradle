plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"worldgen_assist" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// Opt-in isolated functional fixture. Normal runClient/runServer are unchanged.
	if (project.hasProperty('fixtureRunRoot')) {
		def fixtureRoot = project.file(project.property('fixtureRunRoot')).canonicalFile
		def evidenceRoot = project.file('test-artifacts').canonicalFile.toPath()
		if (!fixtureRoot.toPath().startsWith(evidenceRoot) || fixtureRoot.toPath() == evidenceRoot) {
			throw new GradleException('fixtureRunRoot must be a child of test-artifacts')
		}
		runs {
			settingsSmokeClient {
				client()
				runDir new File(fixtureRoot, 'settings-client').absolutePath
				vmArg '-Xmx2G'
				vmArg '-Dworldgen_assist.settings_smoke=true'
				vmArg "-Dworldgen_assist.settings_smoke_root=${evidenceRoot}"
				programArgs '--username', 'SettingsSmoke'
				ideConfigGenerated false
			}
			fixtureServer {
				server()
				runDir new File(fixtureRoot, 'server').absolutePath
				vmArg '-Xmx2G'
				ideConfigGenerated false
			}
			fixtureClient {
				client()
				runDir new File(fixtureRoot, 'client').absolutePath
				vmArg '-Xmx2G'
				programArgs '--username', project.findProperty('fixtureUsername') ?: 'FixtureWorker', '--quickPlayMultiplayer', '127.0.0.1:25585'
				ideConfigGenerated false
			}
		}
	}
}

// The 26.2 public-seed transcript fixture depends on the removed 26.3
// interpolation pipeline. Keep its source for the published maintenance line,
// but never compile or register it in a 26.3 artifact until reverified.
sourceSets.main.java.exclude '**/*SeededLeaf*.java', '**/SeedDependencyAnalyzer.java',
	'**/BlendedNoiseSeedTraceMixin.java', '**/NormalNoiseSeedTraceMixin.java',
	'**/ServerChunkCacheFixtureWaitMixin.java'
sourceSets.client.java.exclude '**/*SeededLeaf*.java'
// The 26.2 JUnit sources exercise APIs removed in 26.3. Keep them on the
// published maintenance branch; this branch uses a small 26.3-focused suite.
sourceSets.test.java.setSrcDirs(['src/portTest/java'])
// Reuse the narrow permission/revision tests from the 26.2 suite: these
// policy APIs are shared by every 26.3 loader and did not change shape.
sourceSets.test.java.srcDir('src/test/java')
sourceSets.test.java.exclude { entry ->
	def legacyRoot = file('src/test/java').canonicalPath
	entry.file.isFile() && entry.file.canonicalPath.startsWith(legacyRoot) &&
		!(entry.file.name in ['ServerSettingsMenuTest.java', 'ServerSettingsDecisionServiceTest.java'])
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

// Read-only diagnosis of already completed fixtures; not another test/worldgen run.
tasks.register('inspectSavedDecoration', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'io.github.genichimaruo.worldgenassist.server.SavedDecorationInspector263'
	maxHeapSize = '2G'
	args providers.gradleProperty('savedDecorationDescriptor').map { [it] }.getOrElse([])
}

// Independent light invariant on already-saved blocks; no production runtime or generator.
tasks.register('inspectSavedLighting', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'io.github.genichimaruo.worldgenassist.server.SavedLightingInspector263'
	maxHeapSize = '2G'
	args providers.gradleProperty('savedLightingDescriptor').map { [it] }.getOrElse([])
}

// Exact failed-window biome-history hypothesis; no terrain or Minecraft runtime.
tasks.register('inspectPublicPeerCaptures', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'io.github.genichimaruo.worldgenassist.server.PublicPeerCaptureInspector263'
	maxHeapSize = '2G'
	args providers.gradleProperty('peerCaptureCase').map { [it, providers.gradleProperty('peerCaptureOutput').get()] }.getOrElse([])
}

tasks.register('inspectBiomeHistory', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'io.github.genichimaruo.worldgenassist.server.BiomeHistoryInspector263'
	maxHeapSize = '2G'
	args providers.gradleProperty('biomeHistoryOutput').map { [it,
		providers.gradleProperty('biomeHistoryX').getOrElse('-2012'),
		providers.gradleProperty('biomeHistoryZ').getOrElse('3041'),
		providers.gradleProperty('biomeHistoryProfile').getOrElse('plain')] }.getOrElse([])
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
