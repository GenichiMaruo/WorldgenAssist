plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"worldgen_assist" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// Opt-in isolated functional fixture. Normal runClient/runServer are unchanged.
	if (project.hasProperty('fixtureRunRoot')) {
		def fixtureRoot = project.file(project.property('fixtureRunRoot')).canonicalFile
		def evidenceRoot = project.file('test-artifacts').canonicalFile.toPath()
		if (!fixtureRoot.toPath().startsWith(evidenceRoot) || fixtureRoot.toPath() == evidenceRoot) {
			throw new GradleException('fixtureRunRoot must be a child of test-artifacts')
		}
		runs {
			fixtureServer {
				server()
				runDir new File(fixtureRoot, 'server').absolutePath
				vmArg '-Xmx2G'
				ideConfigGenerated false
			}
			fixtureClient {
				client()
				runDir new File(fixtureRoot, 'client').absolutePath
				vmArg '-Xmx2G'
				programArgs '--username', project.findProperty('fixtureUsername') ?: 'FixtureWorker', '--quickPlayMultiplayer', '127.0.0.1:25585'
				ideConfigGenerated false
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
